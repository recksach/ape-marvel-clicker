<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MASON ASSET GENERATOR</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#080818;color:#e8e8f0;font-family:system-ui,sans-serif;padding:20px;overflow-y:auto}
h1{color:#f7c948;font-size:22px;margin-bottom:8px;text-align:center;letter-spacing:2px}
.sub{color:rgba(255,255,255,0.3);text-align:center;font-size:13px;margin-bottom:24px}
.controls{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:24px;padding:12px;background:rgba(255,255,255,0.03);border-radius:12px;border:1px solid rgba(255,255,255,0.06)}
.controls button{padding:8px 18px;border:1px solid rgba(255,255,255,0.1);border-radius:8px;background:rgba(255,255,255,0.05);color:#e8e8f0;cursor:pointer;font-size:12px;font-weight:600;transition:all 0.2s}
.controls button:hover{background:rgba(247,201,72,0.15);border-color:#f7c948;color:#f7c948}
.controls button.active{background:rgba(247,201,72,0.2);border-color:#f7c948;color:#f7c948}
.controls select{padding:7px 12px;border:1px solid rgba(255,255,255,0.1);border-radius:8px;background:rgba(8,8,24,0.9);color:#e8e8f0;font-size:12px;cursor:pointer}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px;margin-bottom:20px}
.gallery-item{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px;background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.06);border-radius:10px;cursor:pointer;transition:all 0.2s}
.gallery-item:hover{border-color:#f7c948;background:rgba(247,201,72,0.05)}
.gallery-item canvas{width:100%;max-width:80px;height:auto;image-rendering:pixelated}
.gallery-item .name{font-size:10px;font-weight:600;color:rgba(255,255,255,0.5);text-align:center;line-height:1.2}
.gallery-item .size{font-size:8px;color:rgba(255,255,255,0.2)}
.preview-area{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.85);backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;z-index:100}
.preview-area.show{display:flex}
.preview-box{background:#0a0a24;border:1px solid rgba(247,201,72,0.2);border-radius:16px;padding:24px;max-width:90vw;max-height:90vh;display:flex;flex-direction:column;align-items:center;gap:14px}
.preview-box canvas{max-width:70vw;max-height:55vh;image-rendering:pixelated;border-radius:8px}
.preview-info{text-align:center}
.preview-info .pname{font-size:16px;font-weight:700;color:#f7c948}
.preview-info .pdesc{font-size:12px;color:rgba(255,255,255,0.3);margin-top:4px}
.preview-actions{display:flex;gap:10px;margin-top:4px}
.preview-actions button{padding:8px 24px;border-radius:8px;border:none;font-size:13px;font-weight:700;cursor:pointer}
.btn-dl{background:#f7c948;color:#000}
.btn-close{background:rgba(255,255,255,0.08);color:#e8e8f0;border:1px solid rgba(255,255,255,0.1)!important}
.dl-all{background:linear-gradient(135deg,#f7c948,#e6a817);color:#000;padding:10px 28px;border-radius:10px;border:none;font-size:14px;font-weight:800;cursor:pointer;margin-bottom:16px}
.dl-all:hover{transform:scale(1.03)}
.category-label{font-size:13px;font-weight:700;color:#f7c948;margin:16px 0 8px;padding-bottom:4px;border-bottom:1px solid rgba(247,201,72,0.1);letter-spacing:1px;text-transform:uppercase}
#log{position:fixed;bottom:8px;right:12px;font-size:10px;color:rgba(255,255,255,0.15);z-index:200}
</style>
</head>
<body>
<h1>◈ MASON GENERATOR ◈</h1>
<div class="sub">Click any asset to preview → Download as transparent PNG</div>
<div class="controls">
  <button onclick="showCategory('all')" class="active" id="catAll">ALL</button>
  <button onclick="showCategory('frames')" id="catFrames">FRAMES</button>
  <button onclick="showCategory('buttons')" id="catButtons">BUTTONS</button>
  <button onclick="showCategory('icons')" id="catIcons">ICONS</button>
  <button onclick="showCategory('badges')" id="catBadges">BADGES</button>
  <button onclick="showCategory('bars')" id="catBars">BARS</button>
  <button onclick="showCategory('slots')" id="catSlots">SLOTS</button>
  <button onclick="showCategory('currency')" id="catCurrency">CURRENCY</button>
  <button onclick="showCategory('corners')" id="catCorners">CORNERS</button>
  <button onclick="showCategory('popups')" id="catPopups">POPUPS</button>
  <button onclick="showCategory('effects')" id="catEffects">EFFECTS</button>
  <button onclick="showCategory('npc')" id="catNpc">NPC</button>
  <button onclick="showCategory('locations')" id="catLocations">LOCATIONS</button>
  <button onclick="showCategory('objects')" id="catObjects">OBJECTS</button>
</div>
<button class="dl-all" onclick="downloadAll()">⬇ DOWNLOAD ALL PNGs</button>
<div id="gallery" class="gallery"></div>
<div class="preview-area" id="preview">
  <div class="preview-box">
    <canvas id="previewCanvas"></canvas>
    <div class="preview-info">
      <div class="pname" id="pname"></div>
      <div class="pdesc" id="pdesc"></div>
    </div>
    <div class="preview-actions">
      <button class="btn-dl" onclick="downloadCurrent()">⬇ Download PNG</button>
      <button class="btn-close" onclick="closePreview()">✕ Close</button>
    </div>
  </div>
</div>
<div id="log"></div>
<script>
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// MASON ASSET GENERATOR — Procedural Canvas Engine
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

const log=(...a)=>document.getElementById('log').textContent='['+new Date().toLocaleTimeString()+'] '+a.join(' ');

function createCanvas(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c}

// ─── HELPERS ───
function roundRect(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath()}
function star(ctx,cx,cy,points,outer,inner,rot=0){ctx.beginPath();for(let i=0;i<points*2;i++){const r=i%2===0?outer:inner;const a=rot+i*Math.PI/points;ctx.lineTo(cx+Math.cos(a)*r,cy+Math.sin(a)*r)}ctx.closePath()}

// ─── GENERATORS ───
const GENERATORS={};

// ═══ FRAMES ═══
GENERATORS.frames=[
  {id:'frame_common',name:'Common',desc:'Matte black metal, subtle bronze corners',w:240,h:320,gen:(c,w,h)=>{
    const ctx=c.getContext('2d');
    roundRect(ctx,4,4,w-8,h-8,12);ctx.fillStyle='#1a1a1a';ctx.fill();
    roundRect(ctx,8,8,w-16,h-16,10);ctx.strokeStyle='#8b7355';ctx.lineWidth=1.5;ctx.stroke();
    roundRect(ctx,12,12,w-24,h-24,8);ctx.fillStyle='#0d0d0d';ctx.fill();
    roundRect(ctx,16,16,w-32,h-32,8);ctx.strokeStyle='#5a4a3a';ctx.lineWidth=1;ctx.stroke();
    for(let i=0;i<4;i++){const a=i*Math.PI/2+Math.PI/4;const cx=16+Math.cos(a)*12,cy=16+Math.sin(a)*12;ctx.fillStyle='#b8963c';ctx.beginPath();ctx.arc(cx,cy,3,0,Math.PI*2);ctx.fill()}
  }},
  {id:'frame_uncommon',name:'Uncommon',desc:'Dark metallic with emerald accents',w:240,h:320,gen:(c,w,h)=>{
    const ctx=c.getContext('2d');
    roundRect(ctx,4,4,w-8,h-8,12);ctx.fillStyle='#0f0f1a';ctx.fill();
    roundRect(ctx,8,8,w-16,h-16,10);ctx.strokeStyle='#00b894';ctx.lineWidth=2;ctx.stroke();
    roundRect(ctx,14,14,w-28,h-28,8);ctx.fillStyle='#080818';ctx.fill();
    for(let i=0;i<8;i++){const a=i*Math.PI/4;const dx=Math.cos(a)*(w/2-12),dy=Math.sin(a)*(h/2-12);ctx.fillStyle='#00b894';ctx.globalAlpha=0.3+0.2*Math.sin(i);ctx.beginPath();ctx.arc(w/2+dx,h/2+dy,2,0,Math.PI*2);ctx.fill()}
    ctx.globalAlpha=1;roundRect(ctx,18,18,w-36,h-36,6);ctx.strokeStyle='#6c5ce7';ctx.lineWidth=1;ctx.stroke()
  }},
  {id:'frame_rare',name:'Rare',desc:'Black-gold with floating emerald particles',w:240,h:320,gen:(c,w,h)=>{
    const ctx=c.getContext('2d');
    roundRect(ctx,4,4,w-8,h-8,14);const g=ctx.createLinearGradient(0,0,w,0);g.addColorStop(0,'#1a1a0a');g.addColorStop(0.5,'#2a2a0a');g.addColorStop(1,'#1a1a0a');ctx.fillStyle=g;ctx.fill();
    roundRect(ctx,8,8,w-16,h-16,12);ctx.strokeStyle='#f7c948';ctx.lineWidth=2.5;ctx.stroke();
    roundRect(ctx,14,14,w-28,h-28,10);ctx.fillStyle='#0a0a14';ctx.fill();
    for(let i=0;i<12;i++){const x=20+Math.random()*(w-40),y=20+Math.random()*(h-40);ctx.fillStyle='#00ff88';ctx.globalAlpha=0.4+0.4*Math.random();ctx.beginPath();ctx.arc(x,y,1+Math.random()*2,0,Math.PI*2);ctx.fill()}
    ctx.globalAlpha=1;roundRect(ctx,20,20,w-40,h-40,8);ctx.strokeStyle='#f7c948';ctx.lineWidth=1;ctx.setLineDash([4,4]);ctx.stroke();ctx.setLineDash([])
  }},
  {id:'frame_epic',name:'Epic',desc:'Obsidian with purple crystal engravings',w:240,h:320,gen:(c,w,h)=>{
    const ctx=c.getContext('2d');
    roundRect(ctx,4,4,w-8,h-8,14);ctx.fillStyle='#0a0014';ctx.fill();
    roundRect(ctx,8,8,w-16,h-16,12);ctx.strokeStyle='#a855f7';ctx.lineWidth=2.5;ctx.stroke();
    roundRect(ctx,14,14,w-28,h-28,10);ctx.fillStyle='#060012';ctx.fill();
    for(let i=0;i<6;i++){const a=i*Math.PI/3;const d=w/2-20;ctx.fillStyle='#a855f7';ctx.globalAlpha=0.5+0.3*Math.sin(i);star(ctx,w/2+Math.cos(a)*d,h/2+Math.sin(a)*d,5,6,3,i);ctx.fill()}
    ctx.globalAlpha=1;roundRect(ctx,20,20,w-40,h-40,8);ctx.strokeStyle='#c084fc';ctx.lineWidth=1.5;ctx.stroke();
    const grd=ctx.createRadialGradient(w/2,h/2,10,w/2,h/2,40);grd.addColorStop(0,'rgba(168,85,247,0.08)');grd.addColorStop(1,'transparent');ctx.fillStyle=grd;ctx.fillRect(10,10,w-20,h-20)
  }},
  {id:'frame_legendary',name:'Legendary',desc:'Massive golden frame with giant eye',w:280,h:360,gen:(c,w,h)=>{
    const ctx=c.getContext('2d');
    roundRect(ctx,4,4,w-8,h-8,16);ctx.fillStyle='#1a1400';ctx.fill();
    roundRect(ctx,8,8,w-16,h-16,14);ctx.strokeStyle='#f7c948';ctx.lineWidth=4;ctx.stroke();
    roundRect(ctx,16,16,w-32,h-32,12);ctx.fillStyle='#0f0a00';ctx.fill();
    // Giant eye
    const ex=w/2,ey=h/3-10;ctx.save();ctx.shadowColor='#f7c948';ctx.shadowBlur=20;
    ctx.fillStyle='#fff';ctx.beginPath();ctx.ellipse(ex,ey,28,16,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#f7c948';ctx.beginPath();ctx.ellipse(ex,ey,12,12,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#000';ctx.beginPath();ctx.arc(ex,ey,5,0,Math.PI*2);ctx.fill();ctx.restore();
    for(let i=0;i<10;i++){const a=i*Math.PI/5;const d=w/2-18;ctx.fillStyle='#f7c948';ctx.globalAlpha=0.5;ctx.beginPath();ctx.arc(w/2+Math.cos(a)*d,h/2+10+Math.sin(a)*d,2.5,0,Math.PI*2);ctx.fill()}
    ctx.globalAlpha=1;roundRect(ctx,24,24,w-48,h-48,10);ctx.strokeStyle='#e6a817';ctx.lineWidth=1;ctx.setLineDash([6,3]);ctx.stroke();ctx.setLineDash([])
  }},
  {id:'frame_mythic',name:'Mythic',desc:'Cracked black crystal with molten gold',w:260,h:340,gen:(c,w,h)=>{
    const ctx=c.getContext('2d');
    roundRect(ctx,4,4,w-8,h-8,16);ctx.fillStyle='#080808';ctx.fill();
    roundRect(ctx,8,8,w-16,h-16,14);ctx.strokeStyle='#b45309';ctx.lineWidth=3;ctx.stroke();
    roundRect(ctx,16,16,w-32,h-32,12);ctx.fillStyle='#050505';ctx.fill();
    for(let i=0;i<5;i++){ctx.strokeStyle='#f59e0b';ctx.lineWidth=2;ctx.globalAlpha=0.4+0.3*Math.random();ctx.beginPath();const sx=20+Math.random()*(w-40),sy=20+Math.random()*(h/2-10);ctx.moveTo(sx,sy);ctx.lineTo(sx+10+Math.random()*20,sy+15+Math.random()*20);ctx.lineTo(sx-5+Math.random()*10,sy+30+Math.random()*20);ctx.stroke()}
    ctx.globalAlpha=1;roundRect(ctx,24,24,w-48,h-48,10);ctx.strokeStyle='#d97706';ctx.lineWidth=1.5;ctx.stroke()
  }},
  {id:'frame_ancient',name:'Ancient',desc:'Stone with mysterious runes',w:240,h:320,gen:(c,w,h)=>{
    const ctx=c.getContext('2d');
    roundRect(ctx,4,4,w-8,h-8,12);ctx.fillStyle='#1a1410';ctx.fill();
    roundRect(ctx,8,8,w-16,h-16,10);ctx.strokeStyle='#78716c';ctx.lineWidth=2;ctx.stroke();
    roundRect(ctx,14,14,w-28,h-28,8);ctx.fillStyle='#0f0b08';ctx.fill();
    const runes=['ᛟ','ᚨ','ᛉ','ᛏ','ᛗ','ᛚ','ᛁ','ᚢ'];for(let i=0;i<6;i++){ctx.fillStyle='#00ff88';ctx.globalAlpha=0.3+0.2*Math.sin(i);ctx.font='12px serif';ctx.fillText(runes[i%runes.length],16+Math.random()*(w-32),20+Math.random()*(h-40))}
    ctx.globalAlpha=1;for(let i=0;i<3;i++){ctx.strokeStyle='#44403c';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(10+Math.random()*20,10+Math.random()*20);ctx.quadraticCurveTo(w/2+Math.random()*20-10,h/2+Math.random()*20-10,w-10-Math.random()*20,h-10-Math.random()*20);ctx.stroke()}
  }},
  {id:'frame_divine',name:'Divine',desc:'White gold with sacred emerald rays',w:260,h:340,gen:(c,w,h)=>{
    const ctx=c.getContext('2d');
    roundRect(ctx,4,4,w-8,h-8,16);ctx.fillStyle='#0f0f1a';ctx.fill();
    roundRect(ctx,8,8,w-16,h-16,14);ctx.strokeStyle='#e8e8f0';ctx.lineWidth=3;ctx.stroke();
    roundRect(ctx,16,16,w-32,h-32,12);ctx.fillStyle='#080810';ctx.fill();
    for(let i=0;i<16;i++){const a=i*Math.PI/8;ctx.save();ctx.translate(w/2,h/2);ctx.rotate(a);ctx.fillStyle='#00ff88';ctx.globalAlpha=0.08;ctx.fillRect(-1,-120,2,40);ctx.restore()}
    ctx.globalAlpha=1;roundRect(ctx,24,24,w-48,h-48,10);ctx.strokeStyle='#e8e8f0';ctx.lineWidth=1;ctx.stroke();
    for(let i=0;i<4;i++){const a=i*Math.PI/2+Math.PI/4;ctx.fillStyle='#f7c948';ctx.globalAlpha=0.6;ctx.beginPath();ctx.arc(w/2+Math.cos(a)*(w/2-30),h/2+Math.sin(a)*(h/2-30),3,0,Math.PI*2);ctx.fill()}
    ctx.globalAlpha=1
  }},
  {id:'frame_secret',name:'SECRET',desc:'Impossible geometric floating triangles',w:280,h=360,gen:(c,w,h)=>{
    const ctx=c.getContext('2d');
    roundRect(ctx,4,4,w-8,h-8,16);ctx.fillStyle='#050510';ctx.fill();
    roundRect(ctx,8,8,w-16,h-16,14);ctx.strokeStyle='#10b981';ctx.lineWidth=2;ctx.stroke();
    roundRect(ctx,16,16,w-32,h-32,12);ctx.fillStyle='#020208';ctx.fill();
    // Floating triangles
    for(let i=0;i<7;i++){const angle=Date.now()*0.001+i*2;const dx=Math.cos(angle)*(w/4),dy=Math.sin(angle)*(h/4);ctx.save();ctx.translate(w/2+dx,h/2+dy);ctx.rotate(angle);ctx.fillStyle='#10b981';ctx.globalAlpha=0.2+0.15*Math.sin(angle);ctx.beginPath();ctx.moveTo(0,-10);ctx.lineTo(8,8);ctx.lineTo(-8,8);ctx.closePath();ctx.fill();ctx.restore()}
    // Central eye
    ctx.globalAlpha=1;ctx.save();ctx.shadowColor='#10b981';ctx.shadowBlur=15;ctx.fillStyle='#10b981';ctx.beginPath();ctx.arc(w/2,h/2-15,6,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#fff';ctx.beginPath();ctx.ellipse(w/2,h/2-15,10,5,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#10b981';ctx.beginPath();ctx.ellipse(w/2-2,h/2-15,5,5,0,0,Math.PI*2);ctx.fill()
    ctx.fillStyle='#000';ctx.beginPath();ctx.arc(w/2-2,h/2-15,2,0,Math.PI*2);ctx.fill();ctx.restore()
  }},
];

// ═══ BUTTONS ═══
GENERATORS.buttons=[
  {id:'btn_primary',name:'Primary',desc:'Black obsidian, golden border, emerald glow',w:200,h:64,gen:(c,w,h)=>{
    const ctx=c.getContext('2d');const r=16;
    ctx.shadowColor='rgba(16,185,129,0.3)';ctx.shadowBlur=20;
    roundRect(ctx,2,2,w-4,h-4,r);const g=ctx.createLinearGradient(0,0,0,h);g.addColorStop(0,'#1a1a2e');g.addColorStop(0.5,'#16213e');g.addColorStop(1,'#1a1a2e');ctx.fillStyle=g;ctx.fill();
    ctx.shadowBlur=0;roundRect(ctx,2,2,w-4,h-4,r);ctx.strokeStyle='#f7c948';ctx.lineWidth=2;ctx.stroke();
    roundRect(ctx,8,8,w-16,h-16,r-4);ctx.strokeStyle='rgba(16,185,129,0.3)';ctx.lineWidth=1;ctx.stroke();
    ctx.fillStyle='rgba(16,185,129,0.08)';ctx.fillRect(w/2-30,h/2-8,60,16);
    ctx.fillStyle='#f7c948';ctx.font='bold 16px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('PRIMARY',w/2,h/2)
  }},
  {id:'btn_secondary',name:'Secondary',desc:'Dark bronze, soft gold highlight',w:200,h:56,gen:(c,w,h)=>{
    const ctx=c.getContext('2d');const r=14;
    roundRect(ctx,2,2,w-4,h-4,r);const g=ctx.createLinearGradient(0,0,0,h);g.addColorStop(0,'#2a1f0f');g.addColorStop(0.5,'#3d2e18');g.addColorStop(1,'#2a1f0f');ctx.fillStyle=g;ctx.fill();
    roundRect(ctx,2,2,w-4,h-4,r);ctx.strokeStyle='#8b7355';ctx.lineWidth=1.5;ctx.stroke();
    ctx.fillStyle='#d4a853';ctx.font='bold 14px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('SECONDARY',w/2,h/2)
  }},
  {id:'btn_success',name:'Success',desc:'Emerald crystal glowing',w:200,h:64,gen:(c,w,h)=>{
    const ctx=c.getContext('2d');const r=16;
    ctx.shadowColor='rgba(16,185,129,0.4)';ctx.shadowBlur=25;
    roundRect(ctx,2,2,w-4,h-4,r);const g=ctx.createRadialGradient(w/2,h/2,5,w/2,h/2,40);g.addColorStop(0,'#10b981');g.addColorStop(0.5,'#059669');g.addColorStop(1,'#065f46');ctx.fillStyle=g;ctx.fill();
    ctx.shadowBlur=0;roundRect(ctx,2,2,w-4,h-4,r);ctx.strokeStyle='#34d399';ctx.lineWidth=1.5;ctx.stroke();
    ctx.fillStyle='#fff';ctx.font='bold 16px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('SUCCESS',w/2,h/2)
  }},
  {id:'btn_warning',name:'Warning',desc:'Gold with mysterious symbols',w:200,h=64,gen:(c,w,h)=>{
    const ctx=c.getContext('2d');const r=16;
    roundRect(ctx,2,2,w-4,h-4,r);const g=ctx.createLinearGradient(0,0,0,h);g.addColorStop(0,'#f59e0b');g.addColorStop(0.5,'#d97706');g.addColorStop(1,'#b45309');ctx.fillStyle=g;ctx.fill();
    roundRect(ctx,2,2,w-4,h-4,r);ctx.strokeStyle='#fbbf24';ctx.lineWidth=2;ctx.stroke();
    ctx.fillStyle='rgba(0,0,0,0.2)';ctx.font='12px serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('ᛟ',30,h/2);ctx.fillText('ᛉ',w-30,h/2);
    ctx.fillStyle='#fff';ctx.font='bold 16px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('WARNING',w/2,h/2)
  }},
  {id:'btn_locked',name:'Locked',desc:'Dark metal wrapped in chains',w:200,h=64,gen:(c,w,h)=>{
    const ctx=c.getContext('2d');const r=16;
    roundRect(ctx,2,2,w-4,h-4,r);ctx.fillStyle='#1a1a1a';ctx.fill();
    roundRect(ctx,2,2,w-4,h-4,r);ctx.strokeStyle='#444';ctx.lineWidth=1.5;ctx.stroke();

// ─── CUSTOM / PRESET SYSTEM ───
// User can add new presets by calling addPreset(category, config)
// Config: {id, name, desc, w, h, gen: function(ctx,w,h)}

const allAssets=[];
let currentCategory='all';
let currentPreview=null;

function registerAll(){
  for(const [cat,list] of Object.entries(GENERATORS)){
    for(const a of list){a.category=cat;allAssets.push(a)}
  }
}
registerAll();

function renderGallery(filter){
  const g=document.getElementById('gallery');g.innerHTML='';
  const items=filter==='all'?allAssets:allAssets.filter(a=>a.category===filter);
  let lastCat='';
  for(const a of items){
    if(a.category!==lastCat){const l=document.createElement('div');l.className='category-label';l.textContent=a.category.toUpperCase();g.appendChild(l);lastCat=a.category}
    const div=document.createElement('div');div.className='gallery-item';
    const can=createCanvas(a.w,a.h);a.gen(can,a.w,a.h);
    const name=document.createElement('div');name.className='name';name.textContent=a.name;
    const sz=document.createElement('div');sz.className='size';sz.textContent=a.w+'×'+a.h;
    div.appendChild(can);div.appendChild(name);div.appendChild(sz);
    div.onclick=()=>showPreview(a);
    g.appendChild(div)
  }
}

function showPreview(a){
  currentPreview=a;
  document.getElementById('preview').classList.add('show');
  const can=document.getElementById('previewCanvas');
  can.width=a.w;can.height=a.h;
  a.gen(can.getContext('2d'),a.w,a.h);
  document.getElementById('pname').textContent=a.name+' ['+a.category+']';
  document.getElementById('pdesc').textContent=a.desc+' · '+a.w+'×'+a.h+'px';
}

function closePreview(){document.getElementById('preview').classList.remove('show')}

function downloadAsset(a){
  const can=createCanvas(a.w,a.h);a.gen(can.getContext('2d'),a.w,a.h);
  const link=document.createElement('a');link.download=a.id+'.png';
  link.href=can.toDataURL('image/png');link.click()
}

function downloadCurrent(){if(currentPreview)downloadAsset(currentPreview)}

function downloadAll(){
  const zip=[];let idx=0;
  function next(){
    if(idx>=allAssets.length){log('Downloaded '+allAssets.length+' assets');return}
    const a=allAssets[idx];idx++;
    const can=createCanvas(a.w,a.h);a.gen(can.getContext('2d'),a.w,a.h);
    const link=document.createElement('a');link.download=a.id+'.png';
    link.href=can.toDataURL('image/png');link.style.display='none';
    document.body.appendChild(link);link.click();setTimeout(()=>{document.body.removeChild(link);next()},150)
  }
  if(allAssets.length>50&&!confirm('Download '+allAssets.length+' files? This will trigger many downloads.'))return;
  log('Downloading '+allAssets.length+' assets...');next()
}

function showCategory(cat){
  currentCategory=cat;
  document.querySelectorAll('.controls button').forEach(b=>b.classList.remove('active'));
  const btn=document.getElementById('cat'+cat.charAt(0).toUpperCase()+cat.slice(1));
  if(btn)btn.classList.add('active');
  renderGallery(cat)
}

// ─── PRESET SYSTEM ───
// Call this from console to add new assets:
// addPreset('frames', {id:'my_frame',name:'My Frame',desc:'...',w:240,h:320,gen:(c,w,h)=>{...}})
window.addPreset=(category,config)=>{
  if(!GENERATORS[category])GENERATORS[category]=[];
  config.category=category;
  GENERATORS[category].push(config);
  allAssets.push(config);
  renderGallery(currentCategory);
  log('Added '+config.id+' to '+category)
};

// ─── INIT ───
renderGallery('all')
log('MASON GENERATOR ready · ' + allAssets.length + ' assets loaded')

// Export for console use
window.GENERATORS=GENERATORS;
window.allAssets=allAssets;
</script>
</body>
