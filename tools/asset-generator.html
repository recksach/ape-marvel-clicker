<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Mason Mini App — Asset Generator</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a12;color:#e0dcc0;font-family:system-ui,sans-serif;padding:16px}
h1{font-size:18px;margin-bottom:4px;background:linear-gradient(135deg,#f7c948,#10b981);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.sub{font-size:11px;color:rgba(255,255,255,0.25);margin-bottom:16px}
.controls{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.controls button{padding:8px 16px;border-radius:8px;border:1px solid rgba(247,201,72,0.15);background:rgba(247,201,72,0.04);color:#f7c948;cursor:pointer;font-size:11px;transition:all 0.2s}
.controls button:hover{background:rgba(247,201,72,0.08)}

.categories{display:grid;gap:8px}
.cat{margin-bottom:12px}
.cat-title{font-size:12px;font-weight:600;color:rgba(255,255,255,0.3);margin-bottom:6px;padding:4px 0;border-bottom:1px solid rgba(255,255,255,0.04);text-transform:uppercase;letter-spacing:1px}
.grid{display:flex;flex-wrap:wrap;gap:6px}
.card{background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.04);border-radius:8px;padding:4px;text-align:center}
.card canvas{display:block;margin:0 auto;border-radius:4px}
.card-name{font-size:8px;color:rgba(255,255,255,0.2);margin-top:2px;max-width:80px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dl-btn{font-size:9px;padding:2px 6px;border-radius:4px;border:1px solid rgba(16,185,129,0.15);background:rgba(16,185,129,0.04);color:#10b981;cursor:pointer;margin-top:2px;transition:all 0.2s}
.dl-btn:hover{background:rgba(16,185,129,0.1)}
</style>
</head>
<body>
<h1>⬡ MASON MINI APP — ASSET PACK 05-07</h1>
<div class="sub">Procedural transparent PNG generator — Premium UI Kit + World Environment + NPC Collection</div>
<div class="controls">
<button onclick="generateAll()">Generate All</button>
<button class="download-all" onclick="downloadAll()">Download All PNGs</button>
</div>
<div id="root" class="categories"></div>
<script>
const S = 512, H = S/2;
function bgR(ctx, w, h) { ctx.clearRect(0,0,w,h); }
function roundRect(ctx, x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y); ctx.quadraticCurveTo(x+w,y,x+w,y+r); ctx.lineTo(x+w,y+h-r); ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h); ctx.lineTo(x+r,y+h); ctx.quadraticCurveTo(x,y+h,x,y+h-r); ctx.lineTo(x,y+r); ctx.quadraticCurveTo(x,y,x+r,y); ctx.closePath(); }

// ─── Helper: gradient with angle ───
function grad(ctx, x1,y1,x2,y2,stops) {
  const g = ctx.createLinearGradient(x1,y1,x2,y2);
  stops.forEach(s => g.addColorStop(s[0],s[1]));
  return g;
}
function rgrad(ctx, x1,y1,x2,y2,stops) {
  const g = ctx.createRadialGradient(x1,y1,0,x2,y2,Math.max(...[x2,y2].map(Math.abs)));
  stops.forEach(s => g.addColorStop(s[0],s[1]));
  return g;
}

// ─── Palettes ───
const C = {
  black: '#0a0a12', dark: '#14141e', mid: '#1e1e2e', light: '#2a2a3e',
  gold: '#f7c948', goldL: '#fce38a', goldD: '#c9940e',
  emerald: '#10b981', emeraldL: '#34d399', emeraldD: '#047857',
  bronze: '#8b7355', bronzeL: '#a0896c', bronzeD: '#6d5a3e',
  white: '#e0dcc0', whiteDim: 'rgba(224,220,192,0.3)', whiteD: 'rgba(224,220,192,0.15)',
  purple: '#a855f7', purpleD: '#7c3aed',
  red: '#ef4444', redD: '#dc2626',
  crystal: '#06b6d4',
  greenD: '#064e3b',
  darkGold: '#3a2e0a',
  darkEmerald: '#0a2e1a',
};

// ─── Asset Registry ───
const ASSETS = [];

function reg(cat, name, w, h, fn) {
  ASSETS.push({ cat, name, w, h, fn });
}

// ═══════════════════════════════════════
// FRAME COLLECTION (9)
// ═══════════════════════════════════════
reg('FRAMES', 'frame_common', S, S, (ctx,w,h) => {
  bgR(ctx,w,h); const r = 20, m = 24;
  roundRect(ctx,m,m,w-2*m,h-2*m,r);
  ctx.strokeStyle = C.bronze; ctx.lineWidth = 2.5; ctx.stroke();
  roundRect(ctx,m+4,m+4,w-2*m-8,h-2*m-8,r-4);
  ctx.strokeStyle = C.bronzeD; ctx.lineWidth = 1; ctx.stroke();
  // corners
  for (let sx of [-1,1]) for (let sy of [-1,1]) {
    ctx.save(); ctx.translate(sx<0?m+8:w-m-8, sy<0?m+8:h-m-8);
    ctx.fillStyle = C.bronze; ctx.beginPath(); ctx.arc(0,0,6,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }
});

reg('FRAMES', 'frame_uncommon', S, S, (ctx,w,h) => {
  bgR(ctx,w,h); const r = 20, m = 22;
  roundRect(ctx,m,m,w-2*m,h-2*m,r);
  ctx.strokeStyle = C.dark; ctx.lineWidth = 3; ctx.stroke();
  roundRect(ctx,m+3,m+3,w-2*m-6,h-2*m-6,r-3);
  ctx.strokeStyle = grad(ctx,m,m,w-m,h-m,[[0,C.emeraldD],[0.5,C.emerald],[1,C.emeraldD]]);
  ctx.lineWidth = 2; ctx.stroke();
  // emerald dots
  for (let i=0;i<4;i++) { const a=Math.PI/2*i; ctx.fillStyle=C.emeraldL; ctx.beginPath(); ctx.arc(H+Math.cos(a)*130,H+Math.sin(a)*130,4,0,Math.PI*2); ctx.fill(); }
});

reg('FRAMES', 'frame_rare', S, S, (ctx,w,h) => {
  bgR(ctx,w,h); const r = 20, m = 20;
  roundRect(ctx,m,m,w-2*m,h-2*m,r);
  ctx.strokeStyle = grad(ctx,m,m,w-m,m,[[0,C.goldD],[0.5,C.gold],[1,C.goldD]]);
  ctx.lineWidth = 3; ctx.stroke();
  roundRect(ctx,m+4,m+4,w-2*m-8,h-2*m-8,r-4);
  ctx.strokeStyle = C.black; ctx.lineWidth = 1.5; ctx.stroke();
  // floating particles
  for (let i=0;i<12;i++) { ctx.fillStyle=C.emerald; ctx.globalAlpha=0.3+Math.random()*0.5; ctx.beginPath(); ctx.arc(40+Math.random()*(w-80),40+Math.random()*(h-80),2+Math.random()*3,0,Math.PI*2); ctx.fill(); }
  ctx.globalAlpha=1;
});

reg('FRAMES', 'frame_epic', S, S, (ctx,w,h) => {
  bgR(ctx,w,h); const r = 20, m = 18;
  roundRect(ctx,m,m,w-2*m,h-2*m,r);
  ctx.strokeStyle = C.dark; ctx.lineWidth = 4; ctx.stroke();
  // purple crystal engravings
  for (let i=0;i<8;i++) {
    const a = Math.PI/4*i; ctx.save(); ctx.translate(H,H); ctx.rotate(a);
    ctx.fillStyle = C.purple; ctx.globalAlpha = 0.4; ctx.fillRect(140-2, -1, 30, 2); ctx.globalAlpha = 1;
    ctx.restore();
  }
  roundRect(ctx,m+5,m+5,w-2*m-10,h-2*m-10,r-5);
  ctx.strokeStyle = grad(ctx,m,m,w-m,m,[[0,C.purpleD],[0.5,C.purple],[1,C.purpleD]]); ctx.lineWidth = 2; ctx.stroke();
  // emerald glow runes
  for (let i=0;i<6;i++) { ctx.fillStyle=C.emeraldL; ctx.globalAlpha=0.15+Math.random()*0.2; ctx.font='10px serif'; ctx.fillText('ᛟ',30+Math.random()*(w-60),30+Math.random()*(h-60)); }
  ctx.globalAlpha=1;
});

reg('FRAMES', 'frame_legendary', S, S, (ctx,w,h) => {
  bgR(ctx,w,h); const r = 24, m = 14;
  roundRect(ctx,m,m,w-2*m,h-2*m,r);
  ctx.strokeStyle = grad(ctx,m,m,w-m,m,[[0,C.goldD],[0.3,C.gold],[0.7,C.goldL],[1,C.goldD]]);
  ctx.lineWidth = 4; ctx.stroke();
  roundRect(ctx,m+5,m+5,w-2*m-10,h-2*m-10,r-5);
  ctx.strokeStyle = C.black; ctx.lineWidth = 1; ctx.stroke();
  // Giant Eye
  ctx.save(); ctx.translate(H,H-10);
  ctx.fillStyle = C.gold; ctx.globalAlpha = 0.08; ctx.beginPath(); ctx.ellipse(0,0,60,40,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle = C.gold; ctx.globalAlpha = 0.15; ctx.beginPath(); ctx.arc(0,0,16,0,Math.PI*2); ctx.fill();
  ctx.fillStyle = C.emerald; ctx.globalAlpha = 0.2; ctx.beginPath(); ctx.arc(0,0,8,0,Math.PI*2); ctx.fill();
  ctx.globalAlpha = 1; ctx.restore();
  // rotating ornaments
  for (let i=0;i<4;i++) { const a=Math.PI/2*i+Math.PI/4; ctx.save(); ctx.translate(H+Math.cos(a)*100,H+Math.sin(a)*100); ctx.fillStyle=C.emeraldL; ctx.globalAlpha=0.15; ctx.beginPath(); ctx.arc(0,0,8+Math.sin(a)*4,0,Math.PI*2); ctx.fill(); ctx.globalAlpha=1; ctx.restore(); }
});

reg('FRAMES', 'frame_mythic', S, S, (ctx,w,h) => {
  bgR(ctx,w,h); const r = 20, m = 16;
  // cracked crystal
  roundRect(ctx,m,m,w-2*m,h-2*m,r);
  const grd = grad(ctx,m,m,w-m,h-m,[[0,'#1a1a2e'],[0.3,'#0a0a12'],[0.6,'#1e1e3e'],[1,'#0a0a12']]);
  ctx.fillStyle = grd; ctx.fill();
  ctx.strokeStyle = C.gold; ctx.lineWidth = 3; ctx.stroke();
  // molten gold cracks
  for (let i=0;i<6;i++) { ctx.strokeStyle = C.gold; ctx.globalAlpha=0.3+Math.random()*0.4; ctx.lineWidth=1+Math.random()*2; ctx.beginPath(); ctx.moveTo(H+Math.random()*40-20,H+Math.random()*40-20); ctx.lineTo(H+Math.cos(i)*80,H+Math.sin(i)*80); ctx.stroke(); }
  ctx.globalAlpha=1;
  // emerald fill
  roundRect(ctx,m+4,m+4,w-2*m-8,h-2*m-8,r-4);
  ctx.strokeStyle = C.emerald; ctx.lineWidth = 1; ctx.globalAlpha = 0.3; ctx.stroke(); ctx.globalAlpha = 1;
});

reg('FRAMES', 'frame_ancient', S, S, (ctx,w,h) => {
  bgR(ctx,w,h); const r = 20, m = 18;
  roundRect(ctx,m,m,w-2*m,h-2*m,r);
  ctx.fillStyle = grad(ctx,m,m,w-m,h-m,[[0,'#1a1410'],[0.5,'#0f0d0a'],[1,'#1a1410']]); ctx.fill();
  ctx.strokeStyle = C.bronze; ctx.lineWidth = 3; ctx.stroke();
  // runes
  for (let i=0;i<8;i++) { const a=Math.PI/4*i; ctx.save(); ctx.translate(H+Math.cos(a)*140,H+Math.sin(a)*140); ctx.rotate(a); ctx.fillStyle=C.emeraldL; ctx.globalAlpha=0.2+Math.random()*0.3; ctx.font='14px serif'; ctx.fillText(['ᚱ','ᚢ','ᚾ','ᛖ'][i%4],-7,5); ctx.globalAlpha=1; ctx.restore(); }
  // magical cracks
  for (let i=0;i<5;i++) { ctx.strokeStyle = C.emerald; ctx.globalAlpha=0.15; ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(30+Math.random()*(w-60),30+Math.random()*(h-60)); ctx.lineTo(50+Math.random()*(w-100),50+Math.random()*(h-100)); ctx.stroke(); }
  ctx.globalAlpha=1;
});

reg('FRAMES', 'frame_divine', S, S, (ctx,w,h) => {
  bgR(ctx,w,h); const r = 24, m = 14;
  roundRect(ctx,m,m,w-2*m,h-2*m,r);
  ctx.strokeStyle = grad(ctx,m,m,w-m,m,[[0,'#e0dcc0'],[0.5,'#ffffff'],[1,'#e0dcc0']]); ctx.lineWidth = 4; ctx.stroke();
  roundRect(ctx,m+5,m+5,w-2*m-10,h-2*m-10,r-5);
  ctx.strokeStyle = C.gold; ctx.lineWidth = 1.5; ctx.stroke();
  // sacred rays
  for (let i=0;i<12;i++) { const a=Math.PI/6*i; ctx.save(); ctx.translate(H,H); ctx.rotate(a); ctx.fillStyle=C.emerald; ctx.globalAlpha=0.04+Math.random()*0.04; ctx.fillRect(0,-1,180,2); ctx.globalAlpha=1; ctx.restore(); }
});

reg('FRAMES', 'frame_secret', S, S, (ctx,w,h) => {
  bgR(ctx,w,h); const r = 16, m = 12;
  // impossible geometry: floating triangles
  for (let i=0;i<8;i++) {
    const a=Math.PI/4*i, sz=30+Math.random()*20;
    const cx = H+Math.cos(a)*120, cy = H+Math.sin(a)*120;
    ctx.save(); ctx.translate(cx,cy); ctx.rotate(a+Date.now()/2000);
    ctx.fillStyle = C.dark; ctx.globalAlpha=0.6; ctx.beginPath(); ctx.moveTo(0,-sz); ctx.lineTo(sz*0.866,sz*0.5); ctx.lineTo(-sz*0.866,sz*0.5); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = C.emeraldL; ctx.globalAlpha=0.3; ctx.lineWidth=1; ctx.stroke();
    ctx.globalAlpha=1; ctx.restore();
  }
  // green eye center
  ctx.save(); ctx.translate(H,H);
  ctx.fillStyle = C.emerald; ctx.globalAlpha = 0.1; ctx.beginPath(); ctx.arc(0,0,50,0,Math.PI*2); ctx.fill();
  ctx.fillStyle = C.gold; ctx.globalAlpha = 0.12; ctx.beginPath(); ctx.arc(0,0,20,0,Math.PI*2); ctx.fill();
  ctx.fillStyle = C.emeraldL; ctx.globalAlpha = 0.15; ctx.beginPath(); ctx.arc(0,0,8,0,Math.PI*2); ctx.fill();
  ctx.globalAlpha=1; ctx.restore();
  // outer frame
  roundRect(ctx,m,m,w-2*m,h-2*m,r);
  ctx.strokeStyle = C.emeraldD; ctx.lineWidth = 1.5; ctx.stroke();
});

// ═══════════════════════════════════════
// BUTTONS (8)
// ═══════════════════════════════════════
reg('BUTTONS', 'btn_primary', S, 128, (ctx,w,h) => {
  bgR(ctx,w,h);
  roundRect(ctx,8,8,w-16,h-16,16);
  ctx.fillStyle = grad(ctx,0,0,w,h,[[0,'#1e1e2e'],[0.5,'#14141e'],[1,'#1e1e2e']]); ctx.fill();
  ctx.strokeStyle = C.gold; ctx.lineWidth = 2; ctx.stroke();
  // center emerald glow
  const r = rgrad(ctx,H,H,H,H-20); ctx.addColorStop(0,'rgba(16,185,129,0.15)'); ctx.addColorStop(1,'transparent');
  ctx.fillStyle = r; ctx.beginPath(); ctx.arc(H,h/2,60,0,Math.PI*2); ctx.fill();
});

reg('BUTTONS', 'btn_secondary', S, 128, (ctx,w,h) => {
  bgR(ctx,w,h);
  roundRect(ctx,8,8,w-16,h-16,14);
  ctx.fillStyle = C.dark; ctx.fill(); ctx.strokeStyle = C.bronze; ctx.lineWidth = 1.5; ctx.stroke();
  ctx.fillStyle = C.gold; ctx.globalAlpha = 0.08; ctx.beginPath(); ctx.arc(H,h/2,40,0,Math.PI*2); ctx.fill(); ctx.globalAlpha = 1;
});

reg('BUTTONS', 'btn_success', S, 128, (ctx,w,h) => {
  bgR(ctx,w,h);
  roundRect(ctx,8,8,w-16,h-16,14);
  ctx.fillStyle = grad(ctx,0,0,w,h,[[0,C.emeraldD],[0.5,C.emerald],[1,C.emeraldD]]); ctx.fill();
  ctx.strokeStyle = C.emeraldL; ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,0.1)'; ctx.beginPath(); ctx.arc(H,h/2,50,0,Math.PI*2); ctx.fill();
});

reg('BUTTONS', 'btn_warning', S, 128, (ctx,w,h) => {
  bgR(ctx,w,h);
  roundRect(ctx,8,8,w-16,h-16,14);
  ctx.fillStyle = grad(ctx,0,0,w,h,[[0,'#3a2e0a'],[0.5,C.goldD],[1,'#3a2e0a']]); ctx.fill();
  ctx.strokeStyle = C.gold; ctx.lineWidth = 1.5; ctx.stroke();
  // symbols
  ctx.fillStyle = C.gold; ctx.globalAlpha = 0.15; ctx.font = '20px serif'; ctx.textAlign = 'center'; ctx.fillText('△', H, h/2+7); ctx.globalAlpha = 1;
});

reg('BUTTONS', 'btn_locked', S, 128, (ctx,w,h) => {
  bgR(ctx,w,h);
  roundRect(ctx,8,8,w-16,h-16,14);
  ctx.fillStyle = C.dark; ctx.fill(); ctx.strokeStyle = C.bronzeD; ctx.lineWidth = 1; ctx.stroke();
  // chains
  for (let x of [30,w-30]) { ctx.strokeStyle = C.bronze; ctx.lineWidth = 2; ctx.globalAlpha = 0.3; ctx.beginPath(); ctx.moveTo(x,10); ctx.lineTo(x-8,h-10); ctx.stroke(); }
  ctx.globalAlpha = 1;
  ctx.fillStyle = C.gold; ctx.globalAlpha = 0.2; ctx.font = '18px serif'; ctx.textAlign = 'center'; ctx.fillText('🔒', H, h/2+6); ctx.globalAlpha = 1;
});

reg('BUTTONS', 'btn_claim', S, 128, (ctx,w,h) => {
  bgR(ctx,w,h);
  roundRect(ctx,8,8,w-16,h-16,16);
  ctx.fillStyle = grad(ctx,0,0,w,h,[[0,C.goldD],[0.5,C.gold],[1,C.goldD]]); ctx.fill();
  ctx.strokeStyle = C.goldL; ctx.lineWidth = 2; ctx.stroke();
  // rays
  for (let i=0;i<8;i++) { const a=Math.PI/4*i; ctx.save(); ctx.translate(H,h/2); ctx.rotate(a); ctx.fillStyle='rgba(255,255,255,0.05)'; ctx.fillRect(0,-1.5,120,3); ctx.restore(); }
});

reg('BUTTONS', 'btn_buy', S, 128, (ctx,w,h) => {
  bgR(ctx,w,h);
  roundRect(ctx,8,8,w-16,h-16,14);
  ctx.fillStyle = grad(ctx,0,0,w,h,[[0,'#0a0a12'],[0.5,'#1e1e2e'],[1,'#0a0a12']]); ctx.fill();
  ctx.strokeStyle = C.gold; ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = C.gold; ctx.globalAlpha = 0.12; ctx.beginPath(); ctx.arc(H+40,h/2,20,0,Math.PI*2); ctx.fill(); ctx.globalAlpha = 1;
});

reg('BUTTONS', 'btn_merge', S, 128, (ctx,w,h) => {
  bgR(ctx,w,h);
  roundRect(ctx,8,8,w-16,h-16,14);
  ctx.fillStyle = grad(ctx,0,0,w,h,[[0,C.emeraldD],[0.5,C.emerald],[1,C.emeraldD]]); ctx.fill();
  ctx.strokeStyle = C.gold; ctx.lineWidth = 1.5; ctx.stroke();
  // two triangles converging
  ctx.save(); ctx.translate(H-20,h/2);
  ctx.fillStyle = C.gold; ctx.globalAlpha = 0.15; ctx.beginPath(); ctx.moveTo(0,-18); ctx.lineTo(18,12); ctx.lineTo(-18,12); ctx.closePath(); ctx.fill();
  ctx.translate(40,0); ctx.fillStyle = C.emeraldL; ctx.globalAlpha = 0.15; ctx.beginPath(); ctx.moveTo(0,-12); ctx.lineTo(15,10); ctx.lineTo(-15,10); ctx.closePath(); ctx.fill();
  ctx.globalAlpha = 1; ctx.restore();
});

// ═══════════════════════════════════════
// MENU ICONS (14)
// ═══════════════════════════════════════
function iconBg(ctx) { bgR(ctx,128,128); }
function menuIcon(name, draw) { reg('MENU_ICONS', 'menu_'+name, 128, 128, (ctx,w,h) => { iconBg(ctx); draw(ctx,w,h); }); }
menuIcon('home', (ctx,w,h) => { ctx.save(); ctx.translate(H,H); ctx.fillStyle=C.gold; ctx.globalAlpha=0.9; ctx.beginPath(); ctx.moveTo(0,-30); ctx.lineTo(-28,20); ctx.lineTo(28,20); ctx.closePath(); ctx.fill(); ctx.fillStyle=C.black; ctx.fillRect(-15,0,30,25); ctx.globalAlpha=1; ctx.restore(); });
menuIcon('inventory', (ctx,w,h) => { ctx.save(); ctx.translate(H,H); ctx.fillStyle=C.bronze; ctx.globalAlpha=0.8; roundRect(ctx,-28,-32,56,60,6); ctx.fill(); ctx.fillStyle=C.gold; ctx.globalAlpha=0.6; ctx.beginPath(); ctx.arc(0,-10,8,0,Math.PI*2); ctx.fill(); ctx.strokeStyle=C.black; ctx.lineWidth=2; roundRect(ctx,-18,8,36,18,3); ctx.stroke(); ctx.globalAlpha=1; ctx.restore(); });
menuIcon('collection', (ctx,w,h) => { ctx.save(); ctx.translate(H,H); ctx.fillStyle=C.dark; ctx.globalAlpha=0.9; roundRect(ctx,-32,-24,64,48,4); ctx.fill(); ctx.strokeStyle=C.gold; ctx.lineWidth=2; roundRect(ctx,-32,-24,64,48,4); ctx.stroke(); ctx.fillStyle=C.gold; ctx.globalAlpha=0.5; ctx.fillRect(-25,-16,50,4); ctx.fillRect(-25,-8,35,4); ctx.fillRect(-25,0,42,4); ctx.globalAlpha=1; ctx.restore(); });
menuIcon('market', (ctx,w,h) => { ctx.save(); ctx.translate(H,H); ctx.fillStyle=C.emeraldD; ctx.globalAlpha=0.9; roundRect(ctx,-30,-30,60,50,5); ctx.fill(); ctx.strokeStyle=C.gold; ctx.lineWidth=2; roundRect(ctx,-30,-30,60,50,5); ctx.stroke(); ctx.fillStyle=C.gold; ctx.globalAlpha=0.4; ctx.beginPath(); ctx.arc(0,5,10,0,Math.PI*2); ctx.fill(); ctx.globalAlpha=1; ctx.restore(); });

function progBar(name, fillColor, numStops) {
  reg('PROGRESS_BARS', 'prog_'+name, 512, 64, (ctx,w,h) => {
    bgR(ctx,w,h);
    roundRect(ctx,4,4,w-8,h-8,8);
    ctx.fillStyle = C.dark; ctx.fill();
    ctx.strokeStyle = C.bronzeD; ctx.lineWidth = 1; ctx.stroke();
    // fill
    const gr = grad(ctx,8,8,w-8,h-8,[[0,'transparent'],[0.02,fillColor],[0.9,fillColor],[1,'transparent']]);
    ctx.fillStyle = gr; roundRect(ctx,8,8,w-16-50,h-16,6); ctx.fill();
    if (numStops) for(let i=1;i<=numStops;i++){ctx.strokeStyle='rgba(255,255,255,0.05)';ctx.beginPath();ctx.moveTo(8+(w-16)*i/(numStops+1),6);ctx.lineTo(8+(w-16)*i/(numStops+1),h-6);ctx.stroke();}
  });
}

function npc(name, color, role, size) {
  reg('NPC', 'npc_'+name, size||256, size||256, (ctx,w,h) => {
    bgR(ctx,w,h); ctx.save(); ctx.translate(H,H);
    // hood
    ctx.fillStyle = C.dark; ctx.beginPath(); ctx.moveTo(-40,-50); ctx.quadraticCurveTo(0,-70,40,-50); ctx.lineTo(50,10); ctx.quadraticCurveTo(0,30,-50,10); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = color; ctx.lineWidth = 1.5; ctx.stroke();
    // face glow
    ctx.fillStyle = color; ctx.globalAlpha = 0.06; ctx.beginPath(); ctx.arc(0,-15,25,0,Math.PI*2); ctx.fill(); ctx.globalAlpha = 1;
    // eyes
    ctx.fillStyle = color; ctx.globalAlpha = 0.6; ctx.beginPath(); ctx.arc(-8,-18,3,0,Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.arc(8,-18,3,0,Math.PI*2); ctx.fill(); ctx.globalAlpha = 1;
    // role indicator
    ctx.fillStyle = color; ctx.globalAlpha = 0.3; ctx.font = '8px system-ui'; ctx.textAlign = 'center'; ctx.fillText(role,0,60);
    ctx.globalAlpha = 1; ctx.restore();
  });
}

  alchemy: ['Dark lab background','Shelf silhouettes','Alchemy table','Potion racks','Magic circle floor','Steam rising','Bubble particles','Table foreground'],
  vault: ['Dark vault bg','Mountain of coins','Book shelves','Artifact pedestals','Great vault door','Hanging chains','Gold sparkles','Stone floor'],
  hall: ['Grand hall bg','Master statues','Philosopher stone','White gold columns','Banners','Light rays','Floating dust','Obsidian floor'],
  market: ['Night market bg','Merchant tents','Artifact shelves','Potion displays','Green fire pits','Smoke','Gold particles','Cobblestone'],
  initiation: ['Dark chamber bg','Great seal floor','Light beam from above','Ceremonial chains','Candle circle','Floating symbols','Ash','Stone ring'],
  observatory: ['Starfield sky','Emerald moon','Great telescope','Constellation maps','Floating orbs','Star particles','Nebula glow','Railing foreground'],
  archive: ['Stone corridor bg','File cabinets','Artifact shelves','Old books','Wall torches','Dust motes','Fog','Archway'],
  garden: ['Dark garden sky','Black trees','Emerald leaves','Crystal formations','Stone path','Floating crystals','Fireflies','Grass foreground'],
};

Object.entries(LOCATIONS).forEach(([key, layers]) => {
  layers.forEach((desc, i) => {
    const hue = key === 'temple' ? 160 : key === 'library' ? 270 : key === 'alchemy' ? 140 : key === 'vault' ? 45 : key === 'hall' ? 220 : key === 'market' ? 30 : key === 'initiation' ? 280 : key === 'observatory' ? 210 : key === 'archive' ? 30 : 120;
    const sat = 30 + i * 5;
    const lit = 5 + i * 3;
    reg('LOCATIONS', `loc_${key}_layer${i+1}`, 512, 256, (ctx,w,h) => {
      bgR(ctx,w,h);
      const baseColor = `hsl(${hue},${sat}%,${lit}%)`;
      ctx.fillStyle = baseColor; roundRect(ctx,0,0,w,h,0); ctx.fill();
      // layer distinction
      ctx.fillStyle = `hsl(${hue},${sat+20}%,${lit+5}%)`;
      ctx.globalAlpha = 0.08;
      for (let x=0;x<w;x+=40+Math.sin(i+x)*20) { ctx.fillRect(x,20+Math.sin(x/50)*(h/4),15+i*2,h*0.6); }
      ctx.globalAlpha = 1;
    });
  });
});

// ═══════════════════════════════════════
// RENDER
// ═══════════════════════════════════════
const ROOT = document.getElementById('root');
function render() {
  ROOT.innerHTML = '';
  const cats = [...new Set(ASSETS.map(a => a.cat))];
  cats.forEach(cat => {
    const div = document.createElement('div'); div.className = 'cat';
    const title = document.createElement('div'); title.className = 'cat-title'; title.textContent = cat;
    div.appendChild(title);
    const grid = document.createElement('div'); grid.className = 'grid';
    ASSETS.filter(a => a.cat === cat).forEach(a => {
      const card = document.createElement('div'); card.className = 'card';
      const can = document.createElement('canvas'); can.width = a.w; can.height = a.h;
      if (cat === 'MENU_ICONS' || cat === 'AVATAR_FRAMES' || cat === 'SLOTS' || cat === 'CURRENCIES' || cat === 'CATEGORIES' || cat === 'CORNERS' || cat === 'LIVING_OBJECTS' || cat === 'DECOR') { can.style.width = '64px'; can.style.height = '64px'; }
      else if (cat === 'BUTTONS') { can.style.width = '128px'; can.style.height = '32px'; }
      else if (cat === 'BADGES') { can.style.width = '96px'; can.style.height = '36px'; }
      else if (cat === 'PROGRESS_BARS') { can.style.width = '256px'; can.style.height = '32px'; }
      else if (cat === 'LOCATIONS') { can.style.width = '256px'; can.style.height = '128px'; }
      else if (cat === 'NPC' || cat === 'INTERACTIVE') { can.style.width = '80px'; can.style.height = '80px'; }
      else if (cat === 'EFFECTS') { can.style.width = '64px'; can.style.height = '64px'; }
      else { can.style.width = '96px'; can.style.height = '96px'; }
      const ctx = can.getContext('2d'); a.fn(ctx, a.w, a.h);
      card.appendChild(can);
      const nameDiv = document.createElement('div'); nameDiv.className = 'card-name'; nameDiv.textContent = a.name;
      card.appendChild(nameDiv);
      const dl = document.createElement('button'); dl.className = 'dl-btn'; dl.textContent = 'DL';
      dl.onclick = () => downloadPNG(a.name, can);
      card.appendChild(dl);
      grid.appendChild(card);
    });
    div.appendChild(grid);
    ROOT.appendChild(div);
  });
}

function downloadPNG(name, canvas) {
  const link = document.createElement('a');
  link.download = name + '.png';
  link.href = canvas.toDataURL('image/png');
  link.click();
}

function downloadAll() {
  ASSETS.forEach(a => {
    const can = document.createElement('canvas'); can.width = a.w; can.height = a.h;
    a.fn(can.getContext('2d'), a.w, a.h);
    setTimeout(() => downloadPNG(a.name, can), a.cat.length * 10);
  });
}

function generateAll() { render(); }

render();
</script>
