<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#101521" />
  <title>Gorilla Merge</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="src/style.css" />
  <link rel="stylesheet" href="src/touch.css" />
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div class="profile">
        <img src="assets/gorilla-01.png" alt="" />
        <div><strong id="clanName">СТАЯ</strong><small id="userLevel">LVL 1</small></div>
      </div>
      <div class="balances">
        <span>🍌 <b id="bananas">0</b></span>
        <span>✦ <b id="gems">0</b></span>
      </div>
    </header>
    <section id="screen" class="screen"></section>
    <nav class="bottom-nav" aria-label="Навигация">
      <button data-tab="market"><i>⌁</i><span>РЫНОК</span></button>
      <button data-tab="inventory" class="active"><i>▦</i><span>ИНВЕНТАРЬ</span></button>
      <button data-tab="gorillas"><i>♛</i><span>ГОРИЛЛЫ</span></button>
      <button data-tab="clan"><i>♜</i><span>СТАЯ</span></button>
      <button data-tab="quests"><i>✓</i><span>ЗАДАНИЯ</span></button>
    </nav>
  </main>
  <div id="toast" class="toast" role="status"></div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
